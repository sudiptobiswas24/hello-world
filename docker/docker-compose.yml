version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pp_erp_postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: pp_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d pp_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pp_erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pp_erp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: pp_erp_api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://erp_user:erp_password@postgres:5432/pp_erp?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - /app/apps/api/node_modules
    command: sh -c "cd /app && pnpm --filter api run db:migrate && pnpm --filter api run dev"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: pp_erp_web
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web
      - /app/apps/web/node_modules

  nginx:
    image: nginx:1.25-alpine
    container_name: pp_erp_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  minio_data:
